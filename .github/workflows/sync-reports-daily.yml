name: Actualizar informes 2026/27 diariamente

on:
  schedule:
    # GitHub Actions usa UTC. Se lanzan ambas opciones para cubrir CET/CEST;
    # el paso de comprobacion solo sincroniza cuando son las 06:00 en Madrid.
    - cron: "0 4,5 * * *"
  workflow_dispatch:

jobs:
  sync-reports:
    name: Sincronizar informes 2026/27
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Comprobar hora peninsular
        id: madrid_time
        run: |
          CURRENT_HOUR="$(TZ=Europe/Madrid date +%H)"
          echo "Hora actual en Madrid: ${CURRENT_HOUR}:00"
          if [ "$CURRENT_HOUR" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.madrid_time.outputs.should_sync == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.madrid_time.outputs.should_sync == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.madrid_time.outputs.should_sync == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write private config
        if: steps.madrid_time.outputs.should_sync == 'true'
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF
          mkdir -p .streamlit
          printf '%s' "${{ secrets.STREAMLIT_SECRETS_TOML_B64 }}" | base64 --decode > .streamlit/secrets.toml

      - name: Sync reports for 2026/27
        if: steps.madrid_time.outputs.should_sync == 'true'
        run: python scripts/sync_scouting_reports_to_supabase.py --season "2026/27" --apply

      - name: Skip duplicated timezone trigger
        if: steps.madrid_time.outputs.should_sync != 'true'
        run: 'echo "No se sincroniza: no son las 06:00 en Europe/Madrid."'
