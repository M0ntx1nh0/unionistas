name: Actualizar informes 2026/27 diariamente

on:
  schedule:
    # GitHub Actions usa UTC. Evitamos el minuto 00 porque su planificador
    # puede retrasar u omitir ejecuciones en esa franja. Hay un cron para
    # verano y otro para invierno; el paso siguiente escoge solo el correcto.
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
  workflow_dispatch:

jobs:
  sync-reports:
    name: Sincronizar informes 2026/27
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Comprobar hora peninsular
        id: madrid_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          MADRID_OFFSET="$(TZ=Europe/Madrid date +%z)"
          echo "Hora actual en Madrid: $(TZ=Europe/Madrid date +%H:%M)"
          echo "Disparador programado: ${SCHEDULE_EXPRESSION:-manual}"

          # Si GitHub inicia el runner con retraso, elegimos por el cron que lo
          # originó y no por la hora real de arranque. Así no se pierde la sync.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             { [ "$MADRID_OFFSET" = "+0200" ] && [ "$SCHEDULE_EXPRESSION" = "7 4 * * *" ]; } || \
             { [ "$MADRID_OFFSET" = "+0100" ] && [ "$SCHEDULE_EXPRESSION" = "7 5 * * *" ]; }; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.madrid_time.outputs.should_sync == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.madrid_time.outputs.should_sync == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.madrid_time.outputs.should_sync == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write private config
        if: steps.madrid_time.outputs.should_sync == 'true'
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF
          mkdir -p .streamlit
          printf '%s' "${{ secrets.STREAMLIT_SECRETS_TOML_B64 }}" | base64 --decode > .streamlit/secrets.toml

      - name: Sync reports for 2026/27
        if: steps.madrid_time.outputs.should_sync == 'true'
        run: python scripts/sync_scouting_reports_to_supabase.py --season "2026/27" --apply

      - name: Skip duplicated timezone trigger
        if: steps.madrid_time.outputs.should_sync != 'true'
        run: 'echo "No se sincroniza: este cron no corresponde al horario actual de Madrid."'
